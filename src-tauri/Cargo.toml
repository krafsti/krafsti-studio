[package]
name = "krafsti-studio"
version = "1.36.0"
description = "Krafsti Studio: herramienta de diseño para láser e impresora UV"
authors = ["Krafsti"]
license-file = "../LICENSE.md"
edition = "2021"

[lib]
name = "krafsti_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
